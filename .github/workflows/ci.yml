name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        run: python -m pip install uv==0.12.19
      - name: Install project and test dependencies
        run: uv sync --locked --extra dev
      - name: Check environment
        run: uv run --locked --extra dev python scripts/check_environment.py
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      - name: Run offline test suite
        run: uv run --locked --extra dev pytest -v
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
